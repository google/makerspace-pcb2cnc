metric = true
zmove = 3.0
zero_start = true
preamble = """
(==============================)
(=== pcb2gcode combined job ===)
(===  generated by pcb2cnc  ===)
(==============================)
"""
postamble = """
M2 (Program complete!)
%
"""

[optimize]
tolerance = 0.02
gcode_optimize = 0.0001
pathfinding_steps_limit = 3

[isolation]
depth = 0.1
# Pick the single V-bit you intend to use (501 for 60-deg or 502 for 40-deg)
tools = [501]
# Voronoi produces clean single-boundary isolation cuts without eating the GND pour
voronoi = true
voronoi_preserve_thermals = true

[drilling]
# 2.1mm ensures the conical drill tip (0.3mm) punches fully through a 1.6mm board
# 1.95mm ensures clean through-hole, minimal spoilboard penetration
depth = 1.95

[drilling.milldrill]
minimum = 2.0 
depth = 1.8
tool = 112

[routing]
# 1.8mm ensures complete perimeter separation into the spoilboard
depth = 1.8
tool = 112

[mills.defaults]
rpm = 10000
# Safe default step-down for milling
depth_per_pass = 0.6

[mills.defaults.isolation]
feed = 400
# Slower plunge protects the delicate V-bit tip
plunge = 150

[mills.defaults.routing]
feed = 200
plunge = 200
# 3 passes (0.6mm each) to route a 1.8mm outline smoothly
depth_per_pass = 0.6

[mills.defaults.milldrill]
feed = 200
plunge = 200
depth_per_pass = 0.6

# 1/16" (1.59mm) flat endmill for outline routing and milldrilling ONLY
[mills.112]
diameter = 1.590
isolation = false

# 60-degree V-bit engraver
[mills.501]
diameter = 3.0
angle = 60
ball_diameter = 0.250

# 40-degree V-bit engraver
[mills.502]
diameter = 3.175
angle = 40
ball_diameter = 0.1275
feed = 300
plunge = 150

[drills.defaults]
rpm = 10000
plunge = 400
plunge_max_ratio = 400

[[drills.sequence]]
start = 0.3
end = 1.2
step = 0.1
first = 903
